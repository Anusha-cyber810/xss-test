<script>
document.getElementById('clickme').addEventListener('click', function() {
  const userInput = document.getElementById('input').value;

  // Log into Datadog RUM even if it's an attack
  window.DD_RUM.addAction('user-input-click', {
    input: userInput, 
    attack_detected: userInput.includes('<script>')
  });

  try {
    eval(userInput); // intentionally vulnerable for POC
  } catch (e) {
    console.log("Execution blocked:", e);
  }
});
</script>
